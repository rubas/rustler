[package]
name = "beam_test_demo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# `cargo test` builds the library with this feature, to get the tests into it.
beam_test = ["dep:rustler_beam_test"]

[dependencies]
rustler = { path = "../../../rustler" }
rustler_beam_test = { path = "../../../rustler_beam_test", optional = true }

[dev-dependencies]
rustler = { path = "../../../rustler", features = ["dynamic_symbols"] }
rustler_beam_test = { path = "../../../rustler_beam_test" }
